# Quick-start reel: three photos, a voiceover, music, captions. One format.
#   contentkit video examples/reel.yaml -o out/reel.mp4
brand: brand.yaml
format: reel
voiceover:
  text: >-
    Sound is half the picture. A whoosh on every cut,
    music that ducks under the voice, and a master that platforms don't turn down.
music: {file: assets/loop.wav, volume: 0.3}
captions: {style: pop}
progress: true
scenes:                     # scenes without duration share the voiceover length
  - image: assets/photos/concert-crowd.jpg
    focus: [0.5, 0.4]
    move: in
    kicker: Creator notes
    title: Sound is *half* the picture
    sfx: [{name: boom, at: 0.0, volume: 0.5}]
  - image: assets/photos/guitarist.jpg
    focus: [0.62, 0.45]
    move: right
  - layout: stat
    stat: "−14 LUFS"
    label: the loudness *every* platform plays back at
    source: Master here and nothing gets turned down
    sfx: [pop]
